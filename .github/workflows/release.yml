name: Release

on:
  workflow_dispatch:
    inputs:
      bump-type:
        type: choice
        options: [patch, minor, major]
        default: minor
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && 'bump' || github.ref }}

jobs:
  release:
    uses: RoleModel/actions/.github/workflows/release.yml@v3
    with:
      bump-type: ${{ inputs.bump-type }}
      publish-gem: true
    secrets: inherit
